# Pushing a tag like v1.2.0 builds the zip and publishes a GitHub release for it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history and tags for the release notes

      # Loads the script with OBS stubbed out: catches syntax errors and runs its built-in asserts.
      - name: Check script
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq luajit
          luajit -e "obslua = {} function script_path() return '' end dofile('replay-recording-alerts.lua')"

      - name: Build zip
        run: |
          # The script gets its display name in the zip: OBS's Scripts window lists file names,
          # and v1.0.0 users keep their settings because OBS keys them by path.
          dir="Replay & Recording Alerts"
          mkdir -p "build/$dir"
          git archive HEAD replay-recording-alerts.lua sound_npc_scanner_scanner_photo1.wav README.md LICENSE images \
            | tar -x -C "build/$dir"
          mv "build/$dir/replay-recording-alerts.lua" "build/$dir/$dir.lua"
          (cd build && zip -qr "../Replay-Recording-Alerts-${GITHUB_REF_NAME#v}.zip" "$dir")

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Commit subjects since the previous tag (or all commits on the first release), oldest first,
          # minus GitHub's default "Update <file>" subjects and repeats.
          # Commits touching the script come first; docs and workflow changes go under Other.
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          range="${prev:+$prev..}$GITHUB_REF_NAME"
          subjects() { git log --reverse --pretty='- %s' "$range" "$@" | awk '!/^- Update [^ ]+$/ && !seen[$0]++'; }
          script=$(subjects -- '*.lua')
          other=$(subjects | awk 'NR==FNR { s[$0]; next } !($0 in s)' <(printf '%s\n' "$script") -)
          notes="Download \`Replay-Recording-Alerts-${GITHUB_REF_NAME#v}.zip\` below, extract it, and add \`Replay & Recording Alerts.lua\` in OBS under **Tools → Scripts**. See the [README](https://github.com/${GITHUB_REPOSITORY}#readme) for setup."
          if [ -n "$script" ]; then notes+=$'\n\n## Script\n'"$script"; fi
          if [ -n "$other" ]; then notes+=$'\n\n## Other\n'"$other"; fi
          gh release create "$GITHUB_REF_NAME" Replay-Recording-Alerts-*.zip \
            --title "${GITHUB_REF_NAME#v}" \
            --notes "$notes"
